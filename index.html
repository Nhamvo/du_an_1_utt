<!doctype html>
<html lang="vi">
<title>Tư vấn tuyển sinh ĐHTX UTT</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Bố cục: thanh bên "bảng chỉ dẫn" (hạn nộp, ngành, liên hệ) + khung chat; trên điện thoại thanh bên thành ngăn kéo. */
  :root {
    --bg: #eef2f6;
    --surface: #ffffff;
    --surface-2: #f6f8fb;
    --ink: #13263d;
    --muted: #5a6b80;
    --line: #d8e0ea;
    --brand: #0f3d6e;
    --brand-2: #164f8c;
    --brand-ink: #ffffff;
    --signal: #f2b30c;
    --signal-ink: #13263d;
    --user: #0f3d6e;
    --user-ink: #ffffff;
    --ok: #1f7a4d;
    --refuse: #b4421f;
    --btn: #0f3d6e;
    --link: #164f8c;
    --shadow: 0 1px 2px rgba(19, 38, 61, .06), 0 6px 20px rgba(19, 38, 61, .06);
    --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c141e; --surface: #142131; --surface-2: #101b28; --ink: #e4ebf3; --muted: #93a4b8; --line: #243850;
      --brand: #0b2c50; --brand-2: #2c6cb0; --brand-ink: #f1f5fa; --signal: #f5c242; --signal-ink: #13263d;
      --user: #2c6cb0; --user-ink: #ffffff; --ok: #4cc38a; --refuse: #f08a64; --btn: #2c6cb0; --link: #9cc4ee;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c141e; --surface: #142131; --surface-2: #101b28; --ink: #e4ebf3; --muted: #93a4b8; --line: #243850;
    --brand: #0b2c50; --brand-2: #2c6cb0; --brand-ink: #f1f5fa; --signal: #f5c242; --signal-ink: #13263d;
    --user: #2c6cb0; --user-ink: #ffffff; --ok: #4cc38a; --refuse: #f08a64; --btn: #2c6cb0; --link: #9cc4ee;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
    display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; }
  :is(button, a, textarea):focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  /* ---------- Đầu trang ---------- */
  header { background: var(--brand); color: var(--brand-ink); border-bottom: 4px solid var(--signal); flex: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar { display: flex; align-items: center; gap: 12px; padding-block: 10px; max-width: 1280px; margin: 0 auto; }
  .sign { flex: none; width: 42px; height: 42px; border-radius: 8px; background: var(--signal); color: var(--signal-ink);
    display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: .04em; }
  .titles { min-width: 0; flex: 1; }
  .titles h1 { margin: 0; font-size: 16.5px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
  .titles p { margin: 1px 0 0; font-size: 12px; opacity: .78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mode { flex: none; font-family: var(--font-mono); font-size: 11px; padding: 4px 9px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.35); white-space: nowrap; }
  .mode::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--signal); vertical-align: 1px; }
  .mode.on::before { background: #4cc38a; }
  .tools { display: flex; gap: 4px; flex: none; }
  .icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
  header .icon-btn { color: var(--brand-ink); }
  header .icon-btn:hover { background: rgba(255,255,255,.12); }
  .icon-btn svg { width: 19px; height: 19px; }
  #menuBtn { display: none; }

  /* ---------- Thân ---------- */
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px minmax(0, 1fr); max-width: 1280px; width: 100%; margin: 0 auto; }
  aside { min-height: 0; overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface-2);
    padding: 18px max(16px, env(safe-area-inset-left, 0px)) 24px 16px; display: flex; flex-direction: column; gap: 18px; }
  .panel h2 { margin: 0 0 8px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

  .deadline { background: var(--brand); color: var(--brand-ink); border-radius: 12px; padding: 14px; }
  .deadline .big { font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .deadline .big small { font-size: 14px; font-weight: 500; margin-left: 4px; }
  .deadline p { margin: 6px 0 12px; font-size: 12.5px; opacity: .85; }
  .rounds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .round { border-radius: 8px; padding: 6px 4px; text-align: center; font-size: 11px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); }
  .round b { display: block; font-size: 13px; font-variant-numeric: tabular-nums; }
  .round.done { opacity: .5; }
  .round.next { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); }

  .majors { display: flex; flex-direction: column; gap: 2px; }
  .major { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; padding: 7px 8px; border: 0;
    border-radius: 8px; background: transparent; cursor: pointer; }
  .major:hover { background: var(--surface); }
  .major .n { font-size: 13px; font-weight: 500; line-height: 1.35; }
  .major .q { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; align-self: center; }
  .major .meter { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .major .meter i { display: block; height: 100%; background: var(--brand-2); }
  .major .code { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }

  .contact { padding: 10px 0; border-top: 1px solid var(--line); }
  .contact:first-of-type { border-top: 0; padding-top: 0; }
  .contact strong { font-size: 13.5px; }
  .contact .addr { font-size: 12px; color: var(--muted); margin: 1px 0 6px; }
  .phone { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 2px 0; }
  .phone span { color: var(--muted); }
  .copy { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
    padding: 2px 7px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .copy:hover { border-color: var(--brand-2); }
  .links { display: flex; flex-direction: column; gap: 4px; }
  .links a { font-size: 13px; color: var(--link); text-decoration: none; display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }
  .links a:hover { text-decoration: underline; }
  .links a::after { content: "↗"; color: var(--muted); }

  /* ---------- Chat ---------- */
  .chat { min-height: 0; display: flex; flex-direction: column; }
  #scroller { flex: 1; overflow-y: auto; }
  .inner { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #log { display: flex; flex-direction: column; gap: 18px; padding-block: 22px; }
  .msg { display: flex; gap: 10px; max-width: 92%; min-width: 0; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .bot .avatar { background: var(--signal); color: var(--signal-ink); }
  .user .avatar { background: var(--line); color: var(--ink); }
  .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .user .body { align-items: flex-end; }
  .bubble { padding: 11px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot .bubble { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; box-shadow: var(--shadow); }
  .user .bubble { background: var(--user); color: var(--user-ink); border-top-right-radius: 4px; }
  .bot.refuse .bubble { border-left: 3px solid var(--refuse); }
  .bubble a { color: inherit; text-decoration-color: var(--signal); text-underline-offset: 2px; }
  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .tag { font-family: var(--font-mono); font-size: 10.5px; padding: 2px 7px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
  .tag.llm { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .tag.no { color: var(--refuse); }
  .src { font-size: 11.5px; color: var(--muted); }
  .src b { font-weight: 600; }
  .actions { display: flex; gap: 2px; margin-left: auto; }
  .actions .icon-btn { width: 28px; height: 28px; color: var(--muted); }
  .actions .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .actions .icon-btn svg { width: 15px; height: 15px; }
  .actions .icon-btn.active { color: var(--brand-2); }
  .typing .bubble { display: flex; gap: 5px; padding: 15px 16px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .4; }
  @media (prefers-reduced-motion: no-preference) {
    .msg { animation: in .2s ease-out; }
    @keyframes in { from { transform: translateY(5px); opacity: .3; } }
    .typing i { animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .2s; }
    .typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 40% { opacity: 1; } }
  }

  /* ---------- Ô nhập ---------- */
  .composer { flex: none; border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .composer .inner { padding-block: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chip { flex: none; font-size: 12.5px; padding: 5px 11px; border-radius: 999px; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); }
  .chip:hover { border-color: var(--brand-2); }
  .box { display: flex; align-items: flex-end; gap: 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); padding: 6px; }
  .box:focus-within { border-color: var(--brand-2); }
  #q { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font: inherit; padding: 7px 8px; max-height: 140px; }
  .box .icon-btn { color: var(--muted); }
  .box .icon-btn:hover { background: var(--surface); color: var(--ink); }
  #mic.rec { color: var(--refuse); }
  #send { width: 38px; height: 38px; border-radius: 10px; border: 0; background: var(--btn); color: var(--brand-ink); cursor: pointer; display: grid; place-items: center; }
  #send:disabled { opacity: .45; cursor: default; }
  #send svg { width: 18px; height: 18px; }
  .note { margin: 0; font-size: 11px; color: var(--muted); text-align: center; }

  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg);
    font-size: 13px; padding: 8px 14px; border-radius: 8px; z-index: 30; }
  .scrim { display: none; }

  @media (max-width: 860px) {
    #menuBtn { display: grid; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    aside { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: min(330px, 88vw); transform: translateX(-102%);
      transition: transform .2s ease; box-shadow: var(--shadow); padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
    body.drawer aside { transform: none; }
    body.drawer .scrim { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.35); }
    .mode { display: none; }
    .titles p { display: none; }
  }
</style>

<header>
  <div class="bar">
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Mở thông tin tuyển sinh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="sign" aria-hidden="true">ĐHTX</div>
    <div class="titles">
      <h1>Tư vấn tuyển sinh Đại học từ xa</h1>
      <p>Trường Đại học Công nghệ Giao thông vận tải · Đồ án 1 (sản phẩm sinh viên)</p>
    </div>
    <span class="mode" id="mode">Đang kết nối…</span>
    <div class="tools">
      <button class="icon-btn" id="newBtn" type="button" title="Cuộc trò chuyện mới" aria-label="Cuộc trò chuyện mới">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="exportBtn" type="button" title="Tải cuộc trò chuyện (.txt)" aria-label="Tải cuộc trò chuyện">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="layout">
  <aside id="aside" aria-label="Thông tin tuyển sinh">
    <section class="panel">
      <div class="deadline">
        <div class="big" id="daysLeft">–</div>
        <p id="deadlineText">Hạn nhận hồ sơ</p>
        <div class="rounds" id="rounds"></div>
      </div>
    </section>
    <section class="panel">
      <h2>9 ngành · chỉ tiêu 2026</h2>
      <div class="majors" id="majors"></div>
    </section>
    <section class="panel">
      <h2>Nơi nhận hồ sơ (T2–T6)</h2>
      <div id="contacts"></div>
    </section>
    <section class="panel">
      <h2>Liên kết hữu ích</h2>
      <div class="links" id="links"></div>
    </section>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="chat">
    <div id="scroller">
      <div class="inner"><div id="log" aria-live="polite"></div></div>
    </div>
    <div class="composer">
      <div class="inner">
        <div class="chips" id="chips"></div>
        <form class="box" id="f">
          <textarea id="q" rows="1" maxlength="500" placeholder="Hỏi về ngành, xét tuyển, hồ sơ, hạn nộp…" aria-label="Câu hỏi"></textarea>
          <button class="icon-btn" id="mic" type="button" title="Nói câu hỏi" aria-label="Nhập bằng giọng nói" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button id="send" type="submit" aria-label="Gửi" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
        <p class="note" id="stats">Đang huấn luyện mô hình…</p>
      </div>
    </div>
  </main>
</div>

<script src="bot.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const log = $("log"), scroller = $("scroller"), q = $("q"), send = $("send");
  const STORE = "utt-dhtx-chat-v2";
  let bot, kb, api = "unknown", busy = false, history = [];

  const ICON = {
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></svg>',
    speak: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 11v9H4v-9zM7 11l4-7a2 2 0 0 1 3 2l-1 4h6a2 2 0 0 1 2 2l-2 7a2 2 0 0 1-2 1H7"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 13V4H4v9zM7 13l4 7a2 2 0 0 0 3-2l-1-4h6a2 2 0 0 0 2-2l-2-7a2 2 0 0 0-2-1H7"/></svg>',
  };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // Định dạng tối giản: **đậm**, gạch đầu dòng, đường dẫn.
  function format(text) {
    return esc(text)
      .replace(/^\s*[*-]\s+/gm, "• ")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(https?:\/\/[^\s<)]+[^\s<).,]|\b(?:[\w-]+\.)*utt\.edu\.vn(?:\/[^\s<)]*[^\s<).,])?)/g, (m) =>
        `<a href="${m.startsWith("http") ? m : "https://" + m}" target="_blank" rel="noopener">${m}</a>`);
  }

  function toast(text) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = text; document.body.appendChild(t);
    setTimeout(() => t.remove(), 1600);
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast("Đã sao chép"); }
    catch { toast("Không sao chép được, hãy bôi đen để chép"); }
  }
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(history.slice(-40))); } catch {} };
  const scrollEnd = () => { scroller.scrollTop = scroller.scrollHeight; };

  function render(m) {
    const el = document.createElement("div");
    const refuse = m.intent === "nhay_cam" || m.intent === "ngoai_pham_vi";
    el.className = `msg ${m.role}${refuse ? " refuse" : ""}`;
    el.innerHTML = `<div class="avatar">${m.role === "bot" ? "TS" : "Bạn"}</div><div class="body"><div class="bubble"></div></div>`;
    el.querySelector(".bubble").innerHTML = m.role === "bot" ? format(m.text) : esc(m.text);
    if (m.role === "bot" && !m.greeting) {
      const foot = document.createElement("div");
      foot.className = "foot";
      const tag = refuse ? `<span class="tag no">từ chối · ${m.intent === "nhay_cam" ? "nhạy cảm" : "ngoài phạm vi"}</span>`
        : m.mode === "llm" ? `<span class="tag llm" title="${esc(m.model || "")}">AI + RAG</span>`
        : `<span class="tag" title="Trả lời bằng mô hình học máy đã huấn luyện">Học máy</span>`;
      const src = (m.sources || []).length ? `<span class="src"><b>Nguồn:</b> ${m.sources.map(esc).join(" · ")}</span>` : "";
      foot.innerHTML = tag + (m.intent === "tro_chuyen" ? `<span class="tag">trò chuyện</span>` : m.intent && !refuse ? `<span class="tag">${esc(m.intent)} · ${Math.round((m.score || 0) * 100)}%</span>` : "") + src +
        `<span class="actions">
          <button class="icon-btn" data-a="copy" title="Sao chép" aria-label="Sao chép">${ICON.copy}</button>
          <button class="icon-btn" data-a="speak" title="Đọc to" aria-label="Đọc to">${ICON.speak}</button>
          <button class="icon-btn${m.vote === 1 ? " active" : ""}" data-a="up" title="Hữu ích" aria-label="Hữu ích">${ICON.up}</button>
          <button class="icon-btn${m.vote === -1 ? " active" : ""}" data-a="down" title="Chưa hữu ích" aria-label="Chưa hữu ích">${ICON.down}</button>
        </span>`;
      foot.querySelector(".actions").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        const a = b.dataset.a;
        if (a === "copy") copyText(m.text.replace(/\*\*/g, ""));
        if (a === "speak") speak(m.text);
        if (a === "up" || a === "down") {
          m.vote = m.vote === (a === "up" ? 1 : -1) ? 0 : (a === "up" ? 1 : -1);
          foot.querySelectorAll("[data-a=up],[data-a=down]").forEach((x) => x.classList.toggle("active", m.vote === (x.dataset.a === "up" ? 1 : -1)));
          save();
          if (m.vote === -1) toast("Cảm ơn góp ý! Gõ \"gặp tư vấn viên\" nếu cần hỗ trợ trực tiếp.");
        }
      });
      el.querySelector(".body").appendChild(foot);
    }
    log.appendChild(el);
    scrollEnd();
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) { toast("Trình duyệt không hỗ trợ đọc to"); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\*\*/g, "").replace(/•/g, ""));
    u.lang = "vi-VN";
    const v = speechSynthesis.getVoices().find((x) => x.lang && x.lang.toLowerCase().startsWith("vi"));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }

  function setMode(state) {
    api = state;
    $("mode").className = "mode" + (state === "on" ? " on" : "");
    $("mode").textContent = state === "on" ? "AI + RAG (Gemini)" : "Học máy (ngoại tuyến)";
  }

  // Gọi server LLM + RAG; không có server (host tĩnh) hoặc lỗi -> dùng mô hình học máy ngay trên trình duyệt.
  async function getAnswer(text) {
    if (api !== "off") {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 55000); // dài hơn thời gian chờ Gemini phía server
        const res = await fetch("api/chat", {
          method: "POST", headers: { "Content-Type": "application/json" }, signal: ctrl.signal,
          body: JSON.stringify({ message: text, history: history.filter((h) => !h.greeting).slice(-7, -1).map((h) => ({ role: h.role, text: h.text })) }),
        });
        clearTimeout(timer);
        if (res.status === 404 || res.status === 405) { setMode("off"); throw new Error("no api"); }
        if (!res.ok) throw new Error("HTTP " + res.status);
        setMode("on");
        return await res.json();
      } catch (e) { /* lỗi mạng tạm thời: trả lời bằng học máy, lần sau vẫn thử lại server */ }
    }
    const r = bot.reply(text);
    return { ...r, sources: r.source ? [r.source] : [], mode: "ml" };
  }

  async function ask(text) {
    text = text.trim();
    if (!text || !bot || busy) return;
    busy = true; send.disabled = true;
    const um = { role: "user", text };
    history.push(um); render(um); save();
    const typing = document.createElement("div");
    typing.className = "msg bot typing";
    typing.innerHTML = '<div class="avatar">TS</div><div class="body"><div class="bubble"><i></i><i></i><i></i></div></div>';
    log.appendChild(typing); scrollEnd();
    const r = await getAnswer(text);
    typing.remove();
    const bm = { role: "bot", text: r.answer, intent: r.intent, score: r.score, sources: r.sources, mode: r.mode, model: r.model };
    history.push(bm); render(bm); save();
    busy = false; send.disabled = !q.value.trim();
  }

  function greet() {
    const g = { role: "bot", text: kb.greeting, greeting: true };
    history = [g]; log.innerHTML = ""; render(g); save();
  }

  // ---------- Thanh bên ----------
  function buildAside() {
    const a = kb.admission, now = new Date();
    const close = new Date(a.close + "T23:59:59+07:00");
    const days = Math.ceil((close - now) / 86400000);
    $("daysLeft").innerHTML = days > 0 ? `${days}<small>ngày</small>` : "Đã hết hạn";
    $("deadlineText").textContent = days > 0 ? `còn lại để nộp hồ sơ năm ${a.year} (hạn 10/12/${a.year})` : `Đã hết hạn nhận hồ sơ năm ${a.year}`;
    let marked = false;
    $("rounds").innerHTML = a.rounds.map((r) => {
      const done = now.getFullYear() > a.year || (now.getFullYear() === a.year && now.getMonth() + 1 > r.month);
      const next = !done && !marked && (marked = true);
      return `<div class="round${done ? " done" : ""}${next ? " next" : ""}"><b>T${r.month}</b>${r.label}</div>`;
    }).join("");

    const max = Math.max(...kb.majors.map((m) => m.quota));
    $("majors").innerHTML = kb.majors.map((m, i) =>
      `<button class="major" type="button" data-i="${i}"><span class="n">${esc(m.name)} <span class="code">${m.code}</span></span>` +
      `<span class="q">${m.quota}</span><span class="meter"><i style="width:${(m.quota / max) * 100}%"></i></span></button>`).join("");
    $("majors").onclick = (e) => {
      const b = e.target.closest(".major"); if (!b) return;
      closeDrawer(); ask(`Ngành ${kb.majors[b.dataset.i].name}`);
    };

    $("contacts").innerHTML = kb.contacts.map((c) =>
      `<div class="contact"><strong>${esc(c.campus)}</strong><div class="addr">${esc(c.address)}</div>` +
      c.phones.map(([who, num]) => `<div class="phone"><span>${esc(who)}</span><button class="copy" type="button" data-n="${esc(num)}" title="Sao chép số">${esc(num)}</button></div>`).join("") +
      `</div>`).join("");
    $("contacts").onclick = (e) => { const b = e.target.closest(".copy"); if (b) copyText(b.dataset.n); };

    $("links").innerHTML = kb.links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");

    $("chips").innerHTML = "";
    for (const s of kb.suggestions) {
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.textContent = s;
      b.onclick = () => ask(s);
      $("chips").appendChild(b);
    }
  }

  const closeDrawer = () => document.body.classList.remove("drawer");
  $("menuBtn").onclick = () => document.body.classList.toggle("drawer");
  $("scrim").onclick = closeDrawer;

  // ---------- Công cụ đầu trang ----------
  $("newBtn").onclick = () => { if (!busy && kb) { greet(); toast("Đã bắt đầu cuộc trò chuyện mới"); } };
  $("exportBtn").onclick = () => {
    const lines = history.map((h) => `${h.role === "user" ? "Bạn" : "Chatbot"}: ${h.text.replace(/\*\*/g, "")}`);
    const blob = new Blob([`Cuộc trò chuyện tư vấn tuyển sinh ĐHTX – UTT\n${new Date().toLocaleString("vi-VN")}\n\n${lines.join("\n\n")}\n`], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "tu-van-tuyen-sinh-dhtx.txt"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("themeBtn").onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem(STORE + "-theme", root.dataset.theme); } catch {}
  };
  try { const t = localStorage.getItem(STORE + "-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

  // ---------- Ô nhập ----------
  const grow = () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; };
  q.addEventListener("input", () => { grow(); send.disabled = busy || !q.value.trim(); });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("f").requestSubmit(); } });
  $("f").addEventListener("submit", (e) => { e.preventDefault(); const t = q.value; q.value = ""; grow(); ask(t); q.focus(); });

  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (Rec) {
    const rec = new Rec(); rec.lang = "vi-VN"; rec.interimResults = true;
    let on = false;
    $("mic").hidden = false;
    $("mic").onclick = () => { if (on) rec.stop(); else { try { rec.start(); } catch { toast("Không bật được micro"); } } };
    rec.onstart = () => { on = true; $("mic").classList.add("rec"); };
    rec.onend = () => { on = false; $("mic").classList.remove("rec"); send.disabled = busy || !q.value.trim(); };
    rec.onerror = () => toast("Không nhận được giọng nói. Hãy cho phép micro hoặc gõ câu hỏi.");
    rec.onresult = (e) => { q.value = [...e.results].map((r) => r[0].transcript).join(""); grow(); };
  }

  // ---------- Khởi động: tải tri thức, huấn luyện, khôi phục lịch sử ----------
  // Ưu tiên tri thức mới nhất trên server (gồm dữ liệu admin upload); không có server thì dùng bản nhúng sẵn.
  const fromServer = () => location.protocol === "file:" ? Promise.reject()
    : fetch("api/kb", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
  fromServer()
    .catch(() => window.KB || fetch("data/knowledge.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }))
    .then((data) => {
      kb = data;
      bot = new TuyenSinhBot.Bot(kb);
      const s = bot.model.stats;
      $("stats").textContent = `Mô hình đã huấn luyện: ${s.intents} ý định · ${s.samples} câu mẫu · ${s.documents} tài liệu RAG. ` +
        `Dữ liệu từ thông báo tuyển sinh từ xa 2026 của UTT. Đồ án sinh viên, không phải kênh tư vấn chính thức.`;
      buildAside();
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(STORE)); } catch {}
      if (Array.isArray(saved) && saved.length) { history = saved; history.forEach(render); } else greet();
      // Host tĩnh (file://, Artifact) không có server -> chuyển ngay sang chế độ học máy.
      if (location.protocol === "file:") setMode("off"); else $("mode").textContent = "AI + RAG";
      send.disabled = !q.value.trim();
    })
    .catch((err) => { $("stats").textContent = "Không tải được dữ liệu tri thức (" + err.message + "). Hãy tải lại trang."; });
</script>
